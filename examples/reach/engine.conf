# Read by C++, not interpreted as detection policy by Java.
# Restart the entire server after changing this file or a binary.
trace=false
fastbreak.enabled=true
fastbreak.maximum_ratio=0.65
fastbreak.grace_ms=100
fastbreak.minimum_expected_ms=250
fastbreak.maximum_queue_ms=200
fastbreak.alert_after=3
fastbreak.sample_window_ms=30000

# Research checks; no enforcement or calibrated probability.
reach.enabled=true
reach.maximum_distance=3.0
reach.distance_grace=0.05
reach.box_padding=0.13125
reach.history_ms=750
reach.maximum_motion=0.03
reach.maximum_ping_ms=150
reach.maximum_queue_ms=100
reach.maximum_frame_gap_ms=150
reach.alert_after=3
reach.sample_window_ms=10000

autoclicker.enabled=true
autoclicker.window_intervals=40
autoclicker.minimum_cps=8
autoclicker.maximum_cv=0.05
autoclicker.maximum_mad_ms=2.5
autoclicker.minimum_window_ms=1500
autoclicker.maximum_gap_ms=500
autoclicker.maximum_queue_ms=100
autoclicker.alert_after=3
autoclicker.sample_window_ms=30000

# Vape-mechanism research checks. See docs/VAPE_DETECTIONS.md for exact model scope.
timer.enabled=true
timer.credit_ms=250
timer.lead_ms=250
timer.sustain_ms=500
timer.warmup_ms=1000
timer.maximum_queue_ms=100
timer.uncertain_gap_ms=750
hitboxes.enabled=true
hitboxes.padding=0.13125
hitboxes.angle_grace=3
hitboxes.history_ms=750
hitboxes.alert_after=3
velocity.enabled=true
velocity.epsilon=0.025
velocity.alert_after=3
speed.enabled=true
fly.enabled=true
noslow.enabled=true
nofall.enabled=true
# Implemented for controlled experiments; the client attack-success branch is uncertain.
keepsprint.enabled=false
